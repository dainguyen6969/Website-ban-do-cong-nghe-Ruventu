# Only the free online demo uses this profile; local Docker settings stay separate.
server.port=8080
server.forward-headers-strategy=framework
server.tomcat.threads.max=25
server.tomcat.threads.min-spare=2
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=file:/app/db-truststore.p12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=changeit
spring.data.redis.url=${REDIS_URL}
auth.cookie.secure=true
cart.cookie.secure=true
ruventu.orders.websocket.allowed-origins=${RENDER_EXTERNAL_URL}
ruventu.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD}
ruventu.sales.pending-order-processing-enabled=false
